<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a120b">
<title>Cek Barkot Tembakau — Buku Grade Lapangan</title>
<!-- SheetJS untuk baca Excel langsung di browser -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --wood-dark: #160e08;
    --wood-mid: #271a10;
    --wood-card: #342417;
    --wood-border: #4a3523;
    --paper: #f4ecdc;
    --paper-dim: #e4d7be;
    --paper-sub: #bba88a;
    --gold: #e5a93c;
    --gold-bright: #ffc453;
    --done-bg: #225930;
    --done-border: #388e3c;
    --done-bright: #4caf50;
    --danger: #c62828;
    --danger-bg: #491717;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--wood-dark);
    color: var(--paper);
    font-family: var(--sans);
    min-height: 100vh;
    padding-bottom: 70px;
  }

  /* Header & Sticky Status Bar */
  header {
    background: linear-gradient(180deg, #120b06 0%, var(--wood-mid) 100%);
    border-bottom: 2px solid var(--wood-border);
    padding: 14px 16px 12px;
    position: sticky;
    top: 0;
    z-index: 40;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .badge-tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(229, 169, 60, 0.15);
    border: 1px solid rgba(229, 169, 60, 0.35);
    padding: 3px 8px;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 4px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
  }
  .sub-date {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--paper-sub);
  }

  /* Audio mute toggle & header actions */
  .hdr-btns {
    display: flex;
    gap: 6px;
  }
  .icon-btn {
    background: var(--wood-card);
    border: 1px solid var(--wood-border);
    color: var(--paper);
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .icon-btn:active { transform: scale(0.94); }

  /* Progress Counter */
  .progress-section {
    margin-top: 10px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .progress-bar-bg {
    height: 10px;
    background: #0d0805;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--wood-border);
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #2e7d32, #4caf50);
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    font-size: 12px;
    font-family: var(--mono);
  }
  .stat-highlight {
    font-size: 14px;
    font-weight: 800;
    color: var(--gold-bright);
  }
  .stat-done { color: #81c784; font-weight: 800; }
  .stat-remain { color: #ffb74d; font-weight: 700; }

  /* Layout Container */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px 14px;
  }

  /* Quick Bar (Search & Filter) */
  .quick-bar {
    position: sticky;
    top: 132px;
    z-index: 30;
    background: var(--wood-dark);
    padding: 8px 0;
    margin-bottom: 12px;
  }
  .search-box {
    display: flex;
    gap: 8px;
  }
  .search-box input {
    flex: 1;
    background: var(--wood-card);
    border: 1.5px solid var(--wood-border);
    color: #fff;
    font-size: 15px;
    font-family: var(--mono);
    padding: 10px 14px;
    border-radius: 10px;
    outline: none;
  }
  .search-box input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(229, 169, 60, 0.25);
  }
  .btn-scan {
    background: linear-gradient(135deg, var(--gold), #c98a3d);
    color: #120b06;
    border: none;
    font-weight: 800;
    font-size: 13px;
    padding: 0 14px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .btn-scan:active { transform: scale(0.95); }

  /* Tabs Filter */
  .filter-tabs {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    overflow-x: auto;
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    background: var(--wood-card);
    border: 1.5px solid var(--wood-border);
    color: var(--paper-sub);
    font-weight: 700;
    font-size: 12px;
    padding: 8px 4px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab-btn.active {
    background: var(--paper);
    color: var(--wood-dark);
    border-color: var(--paper);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* Grid Bal Tembakau */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
    gap: 10px;
  }
  @media (min-width: 480px) {
    .grid-container {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }
  }

  /* Chip / Kartu No Gud */
  .chip {
    background: var(--wood-card);
    border: 2px solid var(--wood-border);
    border-radius: 12px;
    padding: 10px 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: transform 0.08s ease, background 0.2s, border-color 0.2s;
    min-height: 96px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.25);
  }
  .chip:active {
    transform: scale(0.92);
  }

  .chip .no-gud {
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 900;
    line-height: 1;
    color: #ffffff;
  }
  .chip .sub-info {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
    justify-content: center;
  }
  .chip .pill {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    background: rgba(0,0,0,0.4);
    color: var(--paper-dim);
  }
  .chip .pill-grade {
    background: rgba(229, 169, 60, 0.2);
    color: var(--gold-bright);
  }
  .chip .status-badge {
    margin-top: 5px;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--paper-sub);
  }

  /* Status SUDAH DIBARKOT */
  .chip.done {
    background: linear-gradient(145deg, #1b4d27 0%, var(--done-bg) 100%);
    border-color: var(--done-bright);
    box-shadow: 0 0 12px rgba(76, 175, 80, 0.35);
  }
  .chip.done .no-gud {
    color: #e8f5e9;
  }
  .chip.done .status-badge {
    color: #a5d6a7;
  }
  .chip.done .pill {
    background: rgba(0, 0, 0, 0.3);
    color: #e8f5e9;
  }
  .chip.done .stamp-check {
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 18px;
    color: #4caf50;
    font-weight: 900;
    line-height: 1;
    animation: stampBounce 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes stampBounce {
    0% { transform: scale(0.2); opacity: 0; }
    80% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .chip.highlight {
    outline: 3px solid var(--gold-bright);
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }
  }

  /* Bottom Drawer / Panels */
  .panel-card {
    background: var(--wood-card);
    border: 1px solid var(--wood-border);
    border-radius: 14px;
    padding: 14px;
    margin-top: 18px;
  }
  .panel-card h3 {
    margin: 0 0 8px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gold);
  }
  .panel-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  button.btn {
    font-family: var(--sans);
    font-weight: 700;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: transform 0.05s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button.btn:active { transform: scale(0.95); }
  .btn-gold { background: var(--gold); color: #120b06; }
  .btn-outline { background: transparent; border: 1.5px solid var(--wood-border); color: var(--paper); }
  .btn-danger-outline { background: transparent; border: 1.5px solid var(--danger); color: #ef5350; }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(40px);
    background: var(--gold);
    color: #120b06;
    font-weight: 800;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 100;
    text-align: center;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success { background: #4caf50; color: #fff; }

  /* Modal Camera Barcode */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(4px);
    z-index: 90;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-box {
    background: var(--wood-card);
    border: 2px solid var(--wood-border);
    border-radius: 16px;
    width: 100%;
    max-width: 440px;
    padding: 16px;
    text-align: center;
  }
  #scannerVideo {
    width: 100%;
    max-height: 260px;
    border-radius: 10px;
    background: #000;
    object-fit: cover;
    border: 2px solid var(--gold);
  }

  .empty-msg {
    text-align: center;
    padding: 40px 10px;
    font-family: var(--mono);
    color: var(--paper-sub);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <span class="badge-tag">Gudang Tembakau · Lapangan</span>
      <h1>Cek Barkot</h1>
      <p class="sub-date" id="dateLabel">Memuat tanggal...</p>
    </div>
    <div class="hdr-btns">
      <button class="icon-btn" id="soundBtn" onclick="toggleSound()" title="Aktifkan/Matikan Suara Bip">🔊 Bip: ON</button>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <div class="progress-stats">
      <span>Sudah: <b class="stat-done" id="countDone">0</b> / <span id="countTotal">0</span></span>
      <span>Sisa: <b class="stat-remain" id="countRemain">0</b></span>
      <span class="stat-highlight" id="pctLabel">0%</span>
    </div>
  </div>
</header>

<main>
  <!-- Quick Bar: Search + Filter Tabs -->
  <div class="quick-bar">
    <div class="search-box">
      <input type="text" id="searchInput" inputmode="numeric" placeholder="Ketik No Gud / Barkot (misal: 107)..." autocomplete="off">
      <button class="btn-scan" onclick="startScanner()">📷 Scan</button>
    </div>
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="setFilter('all', this)" id="tabAll">Semua (0)</button>
      <button class="tab-btn" onclick="setFilter('pending', this)" id="tabPending">⏳ Belum (0)</button>
      <button class="tab-btn" onclick="setFilter('done', this)" id="tabDone">✓ Sudah (0)</button>
    </div>
  </div>

  <!-- Main Grid Daftar Bal -->
  <div class="grid-container" id="balGrid"></div>
  <div class="empty-msg" id="emptyMsg" style="display:none;">Tidak ada data bal yang cocok.</div>

  <!-- Panel Import & Kelola Data -->
  <div class="panel-card">
    <h3>📁 Muat Data Hari Ini</h3>
    <p style="font-size:12px; color:var(--paper-sub); margin:0 0 10px;">
      Bisa langsung pilih file <b>Excel (.xlsx)</b> Buku Grade Induk, atau tempel daftar nomor:
    </p>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
      <label class="btn btn-gold" style="cursor:pointer;">
        📥 Upload File Excel (.xlsx)
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleExcelUpload(event)">
      </label>
      <button class="btn btn-outline" onclick="copyWaSummary()">📋 Salin Laporan WA</button>
    </div>

    <details style="margin-top:12px; font-size:12px; color:var(--paper-dim);">
      <summary style="cursor:pointer; font-weight:700; color:var(--gold);">➕ Tambah / Tempel Manual</summary>
      <textarea id="manualInput" style="width:100%; height:70px; margin-top:8px; background:var(--wood-dark); border:1px solid var(--wood-border); color:#fff; border-radius:8px; padding:8px; font-family:var(--mono);" placeholder="Contoh: 107, 943605, 50 atau cuma: 107 112 123"></textarea>
      <div style="margin-top:6px;">
        <button class="btn btn-gold" style="padding:6px 12px; font-size:12px;" onclick="addManualEntries()">+ Tambah ke Daftar</button>
      </div>
    </details>

    <div class="panel-actions" style="border-top:1px solid var(--wood-border); padding-top:10px; margin-top:12px;">
      <button class="btn btn-outline" onclick="resetChecks()">🔄 Reset Semua Centang</button>
      <button class="btn btn-danger-outline" onclick="clearAllData()">🗑️ Hapus Daftar</button>
    </div>
  </div>
</main>

<!-- Modal Barcode Scanner Kamera -->
<div class="modal-overlay" id="scannerModal">
  <div class="modal-box">
    <h3 style="margin:0 0 10px; color:var(--gold);">📷 Arahkan Kamera ke Barcode</h3>
    <video id="scannerVideo" playsinline></video>
    <p id="scannerStatus" style="font-size:12px; color:var(--paper-sub); margin:8px 0;">Mencari barcode...</p>
    <div style="margin-top:12px;">
      <button class="btn btn-outline" onclick="stopScanner()">Tutup Scanner</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const todayKey = new Date().toISOString().slice(0,10);
const STORAGE_KEY = 'cekbarkot_v2:' + todayKey;

let state = {
  list: [],
  done: {}
};
let currentFilter = 'all'; // 'all' | 'pending' | 'done'
let soundEnabled = true;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) audioCtx = new AudioContext();
  }
}

function playBeep(success = true) {
  if (!soundEnabled) return;
  try {
    initAudio();
    if (!audioCtx) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (success) {
      // High pleasant double-beep for success
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
      osc.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.08); // E6
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } else {
      // Lower short click for undo
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }
  } catch(e) {}
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 Bip: ON' : '🔇 Bip: OFF';
  showToast(soundEnabled ? 'Suara Bip Aktif' : 'Suara Bip Dimatikan');
}

function todayLabel() {
  const d = new Date();
  const hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'][d.getDay()];
  const bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()];
  return `${hari}, ${d.getDate()} ${bulan} ${d.getFullYear()}`;
}
document.getElementById('dateLabel').textContent = todayLabel();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
      if (!state.list) state.list = [];
      if (!state.done) state.done = {};
    }
  } catch(e) {
    console.error('Storage load error', e);
  }

  if (!state.list || state.list.length === 0) {
    state = {
      list: DEFAULT_DATASET.map(x => ({...x})).sort((a,b) => a.no - b.no),
      done: {}
    };
    saveState();
  }
  render();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) {
    console.error('Storage save error', e);
  }
}

function showToast(msg, isSuccess = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isSuccess ? ' success' : '');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => {
    t.className = 'toast';
  }, 1600);
}

// TOGGLE PENCET BAL
function toggleBal(no) {
  initAudio();
  if (state.done[no]) {
    delete state.done[no];
    playBeep(false);
    showToast(`No Gud ${no} dibatalkan`);
  } else {
    state.done[no] = true;
    playBeep(true);
    if (navigator.vibrate) navigator.vibrate(30);
    showToast(`✓ No Gud ${no} SUDAH DIBARKOT`, true);
  }
  saveState();
  render();
}

function setFilter(type, elem) {
  currentFilter = type;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  if (elem) elem.classList.add('active');
  render();
}

function render() {
  const grid = document.getElementById('balGrid');
  const emptyMsg = document.getElementById('emptyMsg');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  
  grid.innerHTML = '';
  
  const validNos = new Set(state.list.map(x => x.no));
  const doneNos = Object.keys(state.done).map(k => parseInt(k,10)).filter(n => validNos.has(n));
  const total = state.list.length;
  const doneCount = doneNos.length;
  const remainCount = Math.max(0, total - doneCount);
  const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

  // Update Counters
  document.getElementById('countDone').textContent = doneCount;
  document.getElementById('countTotal').textContent = total;
  document.getElementById('countRemain').textContent = remainCount;
  document.getElementById('pctLabel').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';

  // Update Tab Labels
  document.getElementById('tabAll').textContent = `Semua (${total})`;
  document.getElementById('tabPending').textContent = `⏳ Belum (${remainCount})`;
  document.getElementById('tabDone').textContent = `✓ Sudah (${doneCount})`;

  // Filter Items
  let filtered = state.list.filter(item => {
    const isDone = !!state.done[item.no];
    if (currentFilter === 'pending' && isDone) return false;
    if (currentFilter === 'done' && !isDone) return false;
    if (query) {
      const matchNo = String(item.no).includes(query);
      const matchBarkot = item.barkot && item.barkot.toLowerCase().includes(query);
      const matchGrade = item.grade && item.grade.toLowerCase().includes(query);
      return matchNo || matchBarkot || matchGrade;
    }
    return true;
  });

  if (filtered.length === 0) {
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = state.list.length === 0 ? 
      'Belum ada data bal. Muat file Excel atau tambahkan di bawah.' : 
      'Tidak ada data bal yang cocok dengan filter / pencarian.';
  } else {
    emptyMsg.style.display = 'none';
    for (const item of filtered) {
      const isDone = !!state.done[item.no];
      const isSearchExact = query && (String(item.no) === query || item.barkot === query);
      
      const chip = document.createElement('div');
      chip.className = 'chip' + (isDone ? ' done' : '') + (isSearchExact ? ' highlight' : '');
      
      const gradeHtml = item.grade ? `<span class="pill pill-grade">Gr: ${item.grade}</span>` : '';
      const barkotHtml = item.barkot ? `<span class="pill">📊 ${item.barkot}</span>` : '';
      const kgHtml = (item.kg !== '' && item.kg !== undefined) ? `<span class="pill">${item.kg} kg</span>` : '';
      
      chip.innerHTML = `
        ${isDone ? '<div class="stamp-check">✓</div>' : ''}
        <div class="no-gud">${item.no}</div>
        <div class="sub-info">${gradeHtml}${barkotHtml}${kgHtml}</div>
        <div class="status-badge">${isDone ? 'SUDAH DIBARKOT' : 'NO GUD'}</div>
      `;
      chip.onclick = () => toggleBal(item.no);
      grid.appendChild(chip);
    }
  }
}

// Search box enter action: langsung tandai jika tepat 1 nomor
document.getElementById('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = e.target.value.trim();
    if (!q) return;
    const match = state.list.find(x => String(x.no) === q || (x.barkot && x.barkot === q));
    if (match) {
      toggleBal(match.no);
      e.target.value = '';
      render();
    } else {
      showToast(`Nomor ${q} tidak ditemukan dalam daftar`);
    }
  }
});
document.getElementById('searchInput').addEventListener('input', render);

// BACA FILE EXCEL LANGSUNG
function handleExcelUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[sheetName];
      const rawJson = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      const parsedItems = [];
      let startRow = 0;

      // Cari baris header yang memuat 'NO GUD' atau nomor
      for (let r = 0; r < rawJson.length; r++) {
        const row = rawJson[r];
        if (row && row.some(cell => String(cell).toUpperCase().includes('NO GUD'))) {
          startRow = r + 1;
          break;
        }
      }

      for (let r = startRow; r < rawJson.length; r++) {
        const row = rawJson[r];
        if (!row || row.length === 0) continue;
        const noVal = row[0];
        if (noVal !== undefined && noVal !== null && /^\d+$/.test(String(noVal).trim())) {
          const no = parseInt(String(noVal).trim(), 10);
          const grade = row[1] !== undefined && row[1] !== null ? String(row[1]).trim() : '';
          const barkot = row[3] !== undefined && row[3] !== null ? String(row[3]).trim() : '';
          const kg = row[4] !== undefined && row[4] !== null ? row[4] : '';
          parsedItems.push({ no, grade, barkot, kg });
        }
      }

      if (parsedItems.length > 0) {
        if (confirm(`Ditemukan ${parsedItems.length} bal tembakau dari file "${file.name}". Muat ke aplikasi?`)) {
          state.list = parsedItems.sort((a,b) => a.no - b.no);
          state.done = {};
          saveState();
          render();
          showToast(`Berhasil memuat ${parsedItems.length} bal tembakau!`, true);
        }
      } else {
        showToast('Tidak ada data No Gud yang terbaca di file Excel ini');
      }
    } catch(err) {
      console.error(err);
      showToast('Gagal membaca file Excel. Pastikan formatnya benar.');
    }
  };
  reader.readAsArrayBuffer(file);
}

// TAMBAH MANUAL DARI TEXTAREA
function addManualEntries() {
  const text = document.getElementById('manualInput').value.trim();
  if (!text) return;
  const lines = text.split(/[\n;]+/);
  let added = 0;
  const byNo = new Map(state.list.map(x => [x.no, x]));

  for (const line of lines) {
    const parts = line.split(/[,\t]+|\s+/).map(s => s.trim()).filter(Boolean);
    if (parts.length > 0 && /^\d+$/.test(parts[0])) {
      const no = parseInt(parts[0], 10);
      const barkot = parts[1] || '';
      const kg = parts[2] || '';
      if (!byNo.has(no)) {
        const item = { no, grade: '', barkot, kg };
        state.list.push(item);
        byNo.set(no, item);
        added++;
      }
    }
  }

  state.list.sort((a,b) => a.no - b.no);
  saveState();
  render();
  document.getElementById('manualInput').value = '';
  showToast(added > 0 ? `+${added} No Gud ditambahkan` : 'Data sudah ada di daftar');
}

function resetChecks() {
  if (confirm('Kosongkan semua status centang hari ini? Daftar bal tetap tersimpan.')) {
    state.done = {};
    saveState();
    render();
    showToast('Semua centang dikosongkan');
  }
}

function clearAllData() {
  if (confirm('Hapus SEMUA daftar bal tembakau hari ini?')) {
    state = { list: [], done: {} };
    saveState();
    render();
    showToast('Daftar dihapus');
  }
}

// CAMERA BARCODE SCANNER
let videoStream = null;
let scanInterval = null;

async function startScanner() {
  const modal = document.getElementById('scannerModal');
  const video = document.getElementById('scannerVideo');
  const status = document.getElementById('scannerStatus');

  modal.classList.add('open');
  status.textContent = 'Membuka kamera...';

  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    video.srcObject = videoStream;
    await video.play();
    status.textContent = 'Arahkan kamera ke stiker barcode tembakau...';

    if ('BarcodeDetector' in window) {
      const barcodeDetector = new BarcodeDetector({
        formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'upc_a', 'upc_e', 'itf']
      });

      scanInterval = setInterval(async () => {
        try {
          const barcodes = await barcodeDetector.detect(video);
          if (barcodes.length > 0) {
            const code = barcodes[0].rawValue.trim();
            status.textContent = `Terdeteksi: ${code}`;
            const match = state.list.find(x => x.barkot === code || String(x.no) === code);
            if (match) {
              toggleBal(match.no);
              stopScanner();
            } else {
              status.textContent = `Barcode ${code} tidak ada di daftar`;
            }
          }
        } catch(e) {}
      }, 400);
    } else {
      status.textContent = 'Kamera aktif. Gunakan pencarian cepat untuk nomor barkot.';
    }
  } catch(err) {
    status.textContent = 'Gagal mengakses kamera (izinkan akses kamera di browser HP).';
  }
}

function stopScanner() {
  const modal = document.getElementById('scannerModal');
  modal.classList.remove('open');
  if (scanInterval) clearInterval(scanInterval);
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
  }
}

// Inisialisasi awal
